<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Typing Test</title>
         <style>
        textarea{
            font-size: 3em;
        }
        
        div{
            margin-top:20px;
            font-size: 5em;
            color:blue;
        }
    
    </style>
    </head>
   
    <body>
        <h1>Typing Throwdown</h1>
        <textarea id="test-area" rows="10" cols="50" oninput="document.getElementById('result').innerHTML=
           Math.round(this.value.length/4.5)+' wpm'">
            
        </textarea>
        
        <div id="result"></div>
        
        
    </body>
</html>
